name: Publish Query Farm core

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example query-farm-iroh-http-core-v0.6.3
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish query-farm-iroh-http-core
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag and package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            query-farm-iroh-http-core-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::invalid release tag: $TAG"; exit 1 ;;
          esac
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "query-farm-iroh-http-core") | .version')
          test "query-farm-iroh-http-core-v$version" = "$TAG" || {
            echo "::error::tag $TAG does not match package version $version"
            exit 1
          }

      - name: Verify package contents
        run: cargo package -p query-farm-iroh-http-core --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish package
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "query-farm-iroh-http-core") | .version')
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: query-farm-iroh-http-core-release (hello@query.farm)' \
            "https://crates.io/api/v1/crates/query-farm-iroh-http-core/$version")
          if [ "$code" = 200 ]; then
            echo "query-farm-iroh-http-core $version already exists on crates.io — skipping"
          else
            cargo publish -p query-farm-iroh-http-core --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
