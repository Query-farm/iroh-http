[package]
name = "query-farm-iroh-http-core"
version = "0.6.3"
edition.workspace = true
description = "Query Farm's Iroh HTTP core with externally routed connection serving"
license.workspace = true
repository = "https://github.com/Query-farm/iroh-http"
documentation = "https://docs.rs/query-farm-iroh-http-core"
keywords = ["iroh", "p2p", "quic", "http", "peer-to-peer"]
categories = ["network-programming", "web-programming::http-client", "web-programming::http-server"]
readme = "README.md"
publish = ["crates-io"]

[lib]
name = "iroh_http_core"

[features]
# Compression (zstd) is always-on; see ADR-014 D2 follow-up. Operators still
# opt in *at runtime* via `CompressionOptions` — the build flag was an
# unnecessary layer of policy disguised as a build switch.

[dependencies]
iroh = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = [
    "add-extension",
    "compression-zstd",
    "decompression-zstd",
    "limit",
    "map-request-body",
    "map-response-body",
] }
moka = { workspace = true }
slotmap = { workspace = true }
futures = { workspace = true }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = "0.10"
base32 = "0.5"
pin-project-lite = "0.2"
dashmap = "6"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
bytes = { workspace = true }
proptest = "1"
serde_json = "1"
criterion = { version = "0.8", features = ["async_tokio"] }
futures = "0.3"
zstd = "0.13"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "channel"
harness = false
